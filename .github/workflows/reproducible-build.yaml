# ============================================================================
# Reproducible-build verification. Determinism is the SDK default for SDK-style
# projects, and Directory.Build.props adds the remaining reproducibility inputs
# (ContinuousIntegrationBuild path-normalization on CI, SourceLink,
# EmbedUntrackedSources). This workflow VERIFIES the output: it builds the same
# commit twice PER OS (ubuntu + windows) and fails if a given OS's two builds are
# not byte-identical. Consumers reproduce the same check from source — see
# docs/REPRODUCIBLE-BUILDS.md (added alongside this workflow).
#
# It gates two things on the compiled assemblies and symbols (.dll + .pdb, every TFM):
# 1. per-OS determinism: two builds of the commit on the same OS are identical;
# 2. cross-OS identity: the Ubuntu and the Windows build are identical.
# (2) holds because Directory.Build.targets rewrites the SDK-generated sources to LF
# and Directory.Build.props compiles net4x targets against the
# Microsoft.NETFramework.ReferenceAssemblies package on every OS; those were the only
# inputs that differed. Package files (.nupkg/.snupkg) are never hashed: NuGet stamps
# the pack time into every zip entry, so they differ on every run.
#
# The symbols also record the compiler version and the runtime the compiler ran on, so
# both runners must resolve the same SDK and runtime; each build prints them, and the
# cross-OS step shows them next to a mismatch.
# ============================================================================
name: Reproducible Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR/branch supersedes the older run; manual runs queue.
concurrency:
  group: reproducible-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: "Build ${{ matrix.os }} (attempt ${{ matrix.attempt }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        attempt: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Record the toolchain
        shell: bash
        run: |
          { echo "sdk: $(dotnet --version)"; dotnet --list-runtimes | grep 'Microsoft.NETCore.App'; } | tee toolchain.txt

      - name: Build (Release, deterministic)
        shell: bash
        run: |
          # Resolve the solution explicitly (no bare `dotnet build`) so a repo with
          # more than one solution/project at the root can't fail on CLI
          # disambiguation. `./`-prefixed glob is dash-safe; guard the no-match case.
          SLN=""
          for candidate in ./*.slnx ./*.sln; do
            if [ -e "$candidate" ]; then SLN="$candidate"; break; fi
          done
          if [ -z "$SLN" ]; then
            echo "::error::No .slnx or .sln at repo root."
            exit 1
          fi
          echo "Building: $SLN"
          # ContinuousIntegrationBuild normalizes stored source paths so two CI
          # runs of the same commit on the same OS produce identical output.
          dotnet build "$SLN" -c Release -p:ContinuousIntegrationBuild=true

      - name: Hash the built Wolfgang.* artifacts
        shell: bash
        run: |
          # Hash both the assemblies and their symbols (.dll + .pdb) so a symbol
          # regression is caught too. Key by <tfm>/<file> so the two attempts line
          # up regardless of path ordering.
          : > hashes.txt
          while IFS= read -r -d '' f; do
            key=$(echo "$f" | sed -E 's#.*/bin/Release/##')
            echo "$(sha256sum "$f" | cut -d' ' -f1)  $key" >> hashes.txt
          done < <(find src -path '*/bin/Release/*' \( -name 'Wolfgang.Extensions.Logging.Data*.dll' -o -name 'Wolfgang.Extensions.Logging.Data*.pdb' \) -print0)
          sort -o hashes.txt hashes.txt

          # Fail loudly if nothing was hashed — otherwise an empty file would make
          # the compare job pass vacuously (e.g. if outputs move or a project is renamed).
          count=$(wc -l < hashes.txt)
          if [ "$count" -eq 0 ]; then
            echo "::error::No Wolfgang.* build artifacts were found to hash — the find pattern or output layout changed."
            exit 1
          fi
          echo "=== ${{ matrix.os }} attempt ${{ matrix.attempt }}: $count artifacts ==="
          cat hashes.txt

      - name: Upload hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-${{ matrix.os }}-${{ matrix.attempt }}
          path: |
            hashes.txt
            toolchain.txt
          retention-days: 3

  compare:
    name: "Compare (per-OS determinism + cross-OS identity)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all hashes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: hashes

      - name: Assert each OS is deterministic
        shell: bash
        run: |
          rc=0
          for os in ubuntu-latest windows-latest; do
            a="hashes/hashes-$os-1/hashes.txt"
            b="hashes/hashes-$os-2/hashes.txt"
            if [ ! -s "$a" ] || [ ! -s "$b" ]; then
              echo "::error::Missing or empty hashes for $os."
              rc=1
              continue
            fi
            if diff -u "$a" "$b"; then
              echo "✅ $os: two builds of the same commit are byte-identical."
            else
              echo "::error::$os build is NOT reproducible — assembly/symbol hashes differ between two builds of the same commit (diff above)."
              rc=1
            fi
          done
          exit "$rc"

      - name: Assert Ubuntu and Windows produce identical assemblies and symbols
        shell: bash
        run: |
          a="hashes/hashes-ubuntu-latest-1/hashes.txt"
          b="hashes/hashes-windows-latest-1/hashes.txt"
          if [ ! -s "$a" ] || [ ! -s "$b" ]; then
            echo "::error::Missing or empty hashes for one of the operating systems."
            exit 1
          fi
          if diff -u "$a" "$b"; then
            echo "✅ Ubuntu and Windows built byte-identical assemblies and symbols."
          else
            echo "Toolchains (a different SDK or compiler-host runtime changes the .pdb):"
            echo "--- ubuntu";  cat hashes/hashes-ubuntu-latest-1/toolchain.txt  || true
            echo "--- windows"; cat hashes/hashes-windows-latest-1/toolchain.txt || true
            echo "::error::The Ubuntu and Windows builds differ (diff above). Check the toolchains first, then the generated sources and the referenced assemblies recorded in the .pdb."
            exit 1
          fi
