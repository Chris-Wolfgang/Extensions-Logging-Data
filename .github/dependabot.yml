version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      dotnet-dependencies:
        patterns:
          - "*"

  # Keep third-party GitHub Actions pinned in workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep the hash-pinned pip tooling (zizmor, semgrep) under .github/requirements
  # up to date. Without this the --require-hashes pins never move, leaving both
  # tools frozen at whatever version was current when they were pinned;
  # Dependabot regenerates the hashes along with the versions.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      pip-tooling:
        patterns:
          - "*"
    ignore:
      # semgrep.txt is compiled by uv with `--override semgrep.overrides.txt`, which forces newer
      # mcp / OpenTelemetry releases than semgrep itself pins (it pins mcp==1.29.0 and the
      # OpenTelemetry 1.37 family). Dependabot's pip resolver has no notion of an override, so
      # every attempt to bump semgrep or a package in the overridden OpenTelemetry family fails
      # with dependency_file_not_resolvable (run 42608350628, 2026-11-09) and leaves a red
      # "Dependabot Updates" run. The family is pinned in lockstep by the override file, so it
      # is ignored by prefix. Move them by regenerating the lock from .github/requirements:
      #   uv pip compile --universal --generate-hashes --upgrade --override semgrep.overrides.txt semgrep.in -o semgrep.txt
      - dependency-name: "semgrep"
      - dependency-name: "opentelemetry-*"
      # semgrep imports mcp.server.fastmcp, which mcp 2.x removed; the override keeps mcp on 1.x.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
